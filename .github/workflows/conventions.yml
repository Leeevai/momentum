name: Conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conventional-commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit of the pull request, but only the files in scripts/: a sparse checkout
          # leaves the rest of the contents out of the clone.
          fetch-depth: 0
          sparse-checkout: scripts
      # Commit subjects only: the pull request title has a format of its own. Editing a pull
      # request reruns this, since changing its base changes which commits it holds.
      - name: Check every commit subject
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-commits.sh --range "$BASE_SHA..$HEAD_SHA"
