name: Enhancement
description: An improvement to something Momentum already does.
labels: ["type: enhancement", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: >-
        Give the issue a plain title that says what to improve, such as "Keep a goal's color when
        the palette changes". For something Momentum doesn't do at all yet, open a feature instead.
  - type: textarea
    id: today
    attributes:
      label: What does Momentum do today?
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What should change?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter?
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: >-
        The parts of Momentum it touches. Work across several areas becomes one sub-issue per area
        at triage.
      multiple: true
      options:
        - "ui: screens and components on Mac and iPhone"
        - "core: the engine and saved data in MomentumCore"
        - "sync: sync between devices"
        - "watch: the watch app and complications"
        - "widgets: widgets and the Live Activity"
        - "mac: the Mac app only"
        - "ios: the iPhone and iPad app only"
        - "import: importing and exporting"
        - "ci: GitHub workflows and checks"
        - "docs: documentation"
        - "tooling: scripts and developer tools"
        - "release: versions and releases"
        - "not sure: leave it for triage"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What has to be true for this to be done, one checkbox each.
      placeholder: |
        - [ ] A goal keeps its own color after the palette changes
        - [ ] The widgets follow it
    validations:
      required: true
