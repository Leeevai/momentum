name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a weekly count goal
        2. Log three workouts
        3. …
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options: [App window, Widget, Menu bar, Notifications, Shortcuts or Siri, Import or export]
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.1
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Momentum version
      description: Settings → About.
      placeholder: "1.0.0"
